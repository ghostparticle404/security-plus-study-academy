name: Build Security+ Academy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate MkDocs Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build website
        run: mkdocs build --clean --strict

      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: security-plus-academy-preview
          path: site/
          retention-days: 7
